name: Site

# Site vitrine et wiki (M14, WEB-03 et WEB-04 ; procédure : docs/DEPLOIEMENT_SITE.md).
# Le site est déployé par Cloudflare Pages (branche main, côté Cloudflare) : ce workflow ne publie rien.
# - pull request qui touche site/ : npm ci + build + liens, shellcheck des installeurs (site/public/install.sh), puis
#   construction de l'image Docker comme contrôle (sans publication).
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build du site (Astro) et de l'image (sans publication)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: npm ci
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build (astro build)
        working-directory: site
        run: npm run build
      - name: Liens internes
        working-directory: site
        run: npm run check-links
      - name: Installeurs (shellcheck, POSIX sh)
        run: shellcheck -s sh site/public/install.sh
      - uses: docker/setup-buildx-action@v3
      - name: Image Docker (construite, non publiée)
        uses: docker/build-push-action@v6
        with:
          context: site
          push: false
          tags: orosmo-site:pr-${{ github.event.pull_request.number }}
