name: M9-L4 probe

# Sonde temporaire (M9-L4) : mesures sur le runner macOS pour la note de décision RHI-13. Retirée avant la fin du lot.
on:
  push:
    branches: ['feat/M9-L4-*']

permissions:
  contents: read

env:
  VCPKG_ROOT: /tmp/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives

jobs:
  measure:
    name: macOS measures (${{ matrix.instance }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - name: Setup macOS tools
        run: brew install ninja cmake zip
      - name: Vulkan on macOS (MoltenVK, loader)
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers vulkan-tools
          sw_vers
          sysctl hw.ncpu hw.memsize machdep.cpu.brand_string
          system_profiler SPDisplaysDataType
          brew list --versions molten-vk vulkan-loader
          ICD="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          test -f "$ICD"
          { echo "VK_DRIVER_FILES=$ICD"; echo "VK_ICD_FILENAMES=$ICD"; } >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-arm64-osx-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-arm64-osx-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-arm64-osx-
      - name: Install vcpkg dependencies
        run: |
          mkdir -p .vcpkg-archives
          "$VCPKG_ROOT/vcpkg" install --triplet=arm64-osx --x-manifest-root=. --x-install-root=./vcpkg_installed --no-print-usage
      - name: Release build from clean, timed (no ccache)
        run: |
          start=$(date +%s)
          make -j3 all-release PROJECT_NAME=Orosmo VCPKG_TRIPLET=arm64-osx VCPKG_INSTALLED_ROOT=./vcpkg_installed
          echo "BUILD release_seconds=$(( $(date +%s) - start )) jobs=3"
      - name: Sizes
        run: |
          BIN=apps/demo/bin/release/Orosmo
          echo "SIZE demo_bytes=$(stat -f %z $BIN)"
          cp $BIN /tmp/stripped && strip /tmp/stripped && echo "SIZE demo_stripped_bytes=$(stat -f %z /tmp/stripped)"
          otool -L $BIN
          for f in "$(brew --prefix molten-vk)"/lib/libMoltenVK.dylib "$(brew --prefix vulkan-loader)"/lib/libvulkan.1.dylib; do
            echo "SIZE $(basename $f)_bytes=$(stat -L -f %z $f)"
          done
      - name: Release capture compared to the reference
        run: |
          BIN="$PWD/apps/demo/bin/release/Orosmo"
          for w in default 0; do
            [ $w = 0 ] && export ENGINE_VULKAN_INDEXED_VIA_INDIRECT=0
            mkdir -p "$PWD/out/cap-$w"
            "$BIN" --api vulkan --strict-backend --headless --ui off --capture "$PWD/out/cap-$w" --capture-frames 5 > "out/cap-$w/demo.log" 2>&1
            grep -E "Graphics device|G510" "out/cap-$w/demo.log" || true
            echo "CAPTURE workaround=$w"
            python3 tools/compare_png.py docs/BASELINE/reference/scene-opengl-demo-1280x720.png "out/cap-$w/scene.png" --tolerance 8 --max-diff-percent 2 || true
          done
      - name: Time to first image (whole process, 1 frame)
        run: |
          cat > /tmp/first.py <<'PY'
          import statistics, subprocess, sys, tempfile, time, re
          BIN = sys.argv[1]
          for mode in (["--headless"], []):
              for ui in ("off", "full"):
                  total, first = [], []
                  for i in range(8):
                      with tempfile.TemporaryDirectory() as d:
                          t = time.monotonic()
                          p = subprocess.run([BIN, "--api", "vulkan", "--strict-backend", "--ui", ui, *mode, "--capture", d, "--capture-frames", "1"],
                                             capture_output=True, text=True, errors="replace", timeout=300)
                          total.append((time.monotonic() - t) * 1000)
                      if p.returncode:
                          print(p.stdout[-2000:], p.stderr[-2000:]); raise SystemExit(1)
                      m = re.search(r"Perf: firstFrameMs=([0-9.]+)", p.stdout + p.stderr)
                      first.append(float(m.group(1)) if m else float("nan"))
                  name = "headless" if mode else "windowed"
                  print(f"FIRST mode={name} ui={ui} run0_process_ms={total[0]:.0f} run0_firstFrame_ms={first[0]:.1f} "
                        f"next7_process_ms median={statistics.median(total[1:]):.0f} min={min(total[1:]):.0f} max={max(total[1:]):.0f} "
                        f"next7_firstFrame_ms median={statistics.median(first[1:]):.1f}")
          PY
          python3 /tmp/first.py "$PWD/apps/demo/bin/release/Orosmo"
      - name: Frame times (7 runs of 300 frames, workaround active)
        run: |
          mkdir -p out
          for ui in off full; do
            python3 tools/perf_compare.py --api vulkan --runs 7 --frames 300 --ui $ui --out out/perf-ui-$ui.json
          done
          python3 tools/perf_compare.py --api vulkan --runs 7 --frames 300 --ui off --extra="--instances 2000 --gpu-driven on" --out out/perf-instances.json
      - name: Frame times without the workaround (direct draws, meshes missing on this GPU)
        env:
          ENGINE_VULKAN_INDEXED_VIA_INDIRECT: '0'
        run: python3 tools/perf_compare.py --api vulkan --runs 7 --frames 300 --ui off --out out/perf-direct.json
      - name: MoltenVK own performance statistics (device lifetime)
        env:
          MVK_CONFIG_PERFORMANCE_TRACKING: '1'
          MVK_CONFIG_ACTIVITY_PERFORMANCE_LOGGING_STYLE: '2'
          MVK_CONFIG_LOG_LEVEL: '3'
        run: |
          BIN="$PWD/apps/demo/bin/release/Orosmo"
          for i in 1 2; do
            echo "MVK run $i"
            mkdir -p "out/mvk-$i"
            "$BIN" --api vulkan --strict-backend --headless --ui full --capture "$PWD/out/mvk-$i" --capture-frames 300 > "out/mvk-$i/demo.log" 2>&1
            grep -v "^\s*$" "out/mvk-$i/demo.log" | grep -E "mvk|ms|MoltenVK|Perf" | head -150
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m9-l4-measures-${{ matrix.instance }}
          path: out
