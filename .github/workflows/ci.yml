name: CI

# Pull requests, pushes to dev, manual runs. The release workflow (build-engine.yml) stays tag-only.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /tmp/vcpkg
  # vcpkg stores every built package as an archive here; the directory is cached below (restore, then save even
  # when a later step fails), so a failed build no longer throws away the 15-30 minutes of dependency builds.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives
  # ccache : résultats de compilation gardés d'un run à l'autre (cache restauré puis sauvé, une clé par job). Un fichier dont
  # l'entrée préprocessée, les options et le compilateur n'ont pas changé n'est pas recompilé. Branché en tête du PATH
  # (/usr/lib/ccache, libexec de Homebrew, lib/ccache/bin de MSYS2) : g++, gcc, c++ et cc passent par lui sans toucher aux Makefiles.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: "true"

jobs:
  # ── Plan: do not repeat a run that already exists ────────────────────────────────────────────────
  # A pull request run is skipped when (1) the PR comes from this repository, (2) the merge commit that pull_request tests has
  # the same content as the PR head (target already contained in the head, or same tree: `main` only adds the merge commit of
  # the previous PR, whose content `dev` already has) and (3) a push run of
  # this workflow for the head commit FINISHED SUCCESSFULLY. A push run that is still queued or running is WAITED for (up to
  # 45 minutes), because opening the PR right after the push is the normal case: GitHub shows a job skipped by a condition as
  # green, so skipping before the result exists (or after a failure) would hide it behind a green PR check, and not waiting
  # would run everything twice. A failed, cancelled or missing push run does not count: the PR then gets its own run.
  # Otherwise (fork, diverged main) the PR gets its own run.
  plan:
    name: Plan (skip a run that already exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          skip=false
          # Même contenu : la cible est déjà dans la tête, OU la fusion testée par pull_request a exactement l'arbre de la tête
          # (cas habituel : `main` a seulement le commit de fusion de la PR précédente, dont le contenu est déjà dans `dev`).
          same_tree=false
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" \
             || [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            same_tree=true
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$same_tree" = true ]; then
            deadline=$((SECONDS + 2700))
            while true; do
              json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push")
              ok=$(echo "$json" | jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
              pending=$(echo "$json" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
              echo "push runs for $HEAD_SHA: $ok succeeded, $pending not finished"
              if [ "${ok:-0}" -gt 0 ]; then skip=true; break; fi
              if [ "${pending:-0}" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
              sleep 30
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"

  # ── Linux : reference platform. apt for everything it has, vcpkg for glad (v1) and msdfgen. ──
  linux:
    name: Linux x64 (build, tests, checks, capture)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo-tools
          key: cargo-linux-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Install system packages (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libwayland-dev libxkbcommon-dev wayland-protocols libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev vulkan-validationlayers libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri mesa-vulkan-drivers ccache

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-linux-

      # Manifest mode: vcpkg.json lists glad and msdfgen (core only, no skia); the other packages come from apt on Linux.
      - name: Install glad and msdfgen (vcpkg, vcpkg.json)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install

      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Link dependencies (apt + vcpkg)
        run: sh tools/setup-linux-deps.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-x64-${{ github.run_id }}
          restore-keys: ccache-linux-x64-

      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats

      - name: Repository checks
        run: |
          sh tools/check-repo.sh
          python3 tools/check_layers.py --strict
          python3 tools/check_api_isolation.py --strict   # gl*, Vk*, MTL*, GLFW, <windows.h> hors de src/rhi/ et src/platform/ : bloquant (M2 lot C)
          python3 tools/check_headers.py --strict

      - name: Build (debug, -Werror)
        run: make -j"$(nproc)" all-debug

      - name: Tests
        run: LIBGL_ALWAYS_SOFTWARE=1 ENGINE_TEST_REQUIRE_GPU=1 xvfb-run -a -s "-screen 0 1280x720x24" make -j"$(nproc)" demo-test

      - name: Interface language compiler (UI-11; cargo test + invalid inputs + C++ errors mapped to the .cui)
        run: make cui-test

      - name: Capture reference images (OpenGL, Mesa llvmpipe under Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            apps/demo/bin/debug/main --api opengl --capture "$PWD/ci-capture" --capture-frames 5
          ls -l ci-capture

      - name: "Compare with the reference image (tolerant, other GPU and driver)"
        continue-on-error: true
        run: |
          python3 tools/compare_png.py docs/BASELINE/reference/scene-opengl-demo-1280x720.png ci-capture/scene.png \
            --tolerance 8 --max-diff-percent 2 --diff-out ci-capture/diff.png

      - name: Headless capture (PLAT-04, no window) identical to the windowed one
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            apps/demo/bin/debug/main --api opengl --headless --capture "$PWD/ci-capture-headless" --capture-frames 5
          python3 tools/compare_png.py ci-capture/scene.png ci-capture-headless/scene.png

      - name: Tool tests (Python)
        run: python3 -m unittest discover -s tests/tools

      - name: Demo captures (HUD, every UI tab, themes, popups; headless)
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" make demo-capture

      - name: End to end from the package (BLD-02; orosmo init, build, run, examples)
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" make -j"$(nproc)" e2e-init

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-x64-${{ github.run_id }}

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: capture-linux-opengl
          path: |
            ci-capture/*.png
            build/demo-capture/*/*.png
          retention-days: 7

  # ── Linux arm64 (ubuntu-24.04-arm) ────────────────────────────────────────────────────────
  # Bloquant (comme Linux x64) depuis le 2026-11-21 : plusieurs runs verts, avertissements en erreur (-Werror).
  # vcpkg has no prebuilt tools for arm64 Linux: VCPKG_FORCE_SYSTEM_BINARIES=1 makes it use the system cmake and ninja.
  linux-arm64:
    name: Linux arm64 (build, tests)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo-tools
          key: cargo-linux-arm64-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: cargo-linux-arm64-

      - name: Install system packages (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libwayland-dev libxkbcommon-dev wayland-protocols libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev vulkan-validationlayers libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri mesa-vulkan-drivers ccache

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-arm64-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-linux-arm64-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-linux-arm64-

      - name: Install glad, msdfgen and nlohmann-json (vcpkg, vcpkg.json)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install --triplet=arm64-linux

      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-arm64-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Link dependencies (apt + vcpkg)
        run: TRIPLET=arm64-linux sh tools/setup-linux-deps.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-arm64-${{ github.run_id }}
          restore-keys: ccache-linux-arm64-

      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats

      - name: Build (debug)
        run: make -j"$(nproc)" all-debug

      - name: Tests
        run: LIBGL_ALWAYS_SOFTWARE=1 ENGINE_TEST_REQUIRE_GPU=1 xvfb-run -a -s "-screen 0 1280x720x24" make -j"$(nproc)" demo-test

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-arm64-${{ github.run_id }}

  # ── Sanitizers : ASan + UBSan on a clean tree (the flags are not part of the object dependencies) ──
  sanitizers:
    name: Linux x64 (ASan + UBSan tests)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable
      - name: Install system packages (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libwayland-dev libxkbcommon-dev wayland-protocols libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev vulkan-validationlayers libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri mesa-vulkan-drivers ccache
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Restore vcpkg archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-linux-
      - name: Install glad and msdfgen (vcpkg, vcpkg.json)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install
      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Link dependencies
        run: sh tools/setup-linux-deps.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-asan-${{ github.run_id }}
          restore-keys: ccache-linux-asan-

      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats
      - name: Tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: LIBGL_ALWAYS_SOFTWARE=1 ENGINE_TEST_REQUIRE_GPU=1 xvfb-run -a -s "-screen 0 1280x720x24" make -j"$(nproc)" demo-test SANITIZE=address,undefined

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-asan-${{ github.run_id }}

  # ── ThreadSanitizer (M8, A79 lot L1) : unit tests (no GPU, no window) under TSan, in a job of its own because TSan cannot be
  #    combined with ASan. Covers core::SpscQueue between two threads, TaskSystem, and later the simulation thread (lot L4). ──
  tsan:
    name: Linux x64 (TSan unit tests)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable
      - name: Install system packages (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libwayland-dev libxkbcommon-dev wayland-protocols libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev vulkan-validationlayers libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            ccache
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-linux-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-linux-
      - name: Install glad and msdfgen (vcpkg, vcpkg.json)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install
      - name: Link dependencies
        run: sh tools/setup-linux-deps.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-tsan-${{ github.run_id }}
          restore-keys: ccache-linux-tsan-

      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --zero-stats
      # Ubuntu 24.04 kernels randomise mmap with 32 bits: the TSan runtime of GCC 13 then aborts ("unexpected memory mapping").
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Unit tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: make -j"$(nproc)" demo-test-unit SANITIZE=thread

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-tsan-${{ github.run_id }}

  # ── Windows and macOS: same entry points through vcpkg manifest mode. ─────────────────────
  # Bloquants depuis le 2026-11-21 (plusieurs runs verts sur les deux systèmes, e2e du paquet compris), avertissements en erreur.
  other-platforms:
    name: ${{ matrix.name }} (build, tests)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MinGW)
            os: windows-latest
            triplet: x64-mingw-static
          - name: macOS arm64
            os: macos-latest
            triplet: arm64-osx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit   # keep the Windows PATH (cargo from dtolnay/rust-toolchain)
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python mingw-w64-x86_64-ccache git zip unzip tar

      - name: Setup macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja cmake zip ccache

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" --depth=1
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Restore vcpkg archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-${{ matrix.triplet }}-

      - name: Install vcpkg dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p .vcpkg-archives
          "$VCPKG_ROOT/vcpkg" install --triplet=${{ matrix.triplet }} --x-manifest-root=. \
            --x-install-root=./vcpkg_installed --no-print-usage

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p .vcpkg-archives
          /tmp/vcpkg/vcpkg install --triplet=${{ matrix.triplet }} --x-manifest-root=. \
            --x-install-root=./vcpkg_installed --no-print-usage

      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.triplet }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.triplet }}-

      - name: Enable ccache
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix)/opt/ccache/libexec" >> "$GITHUB_PATH"
          ccache --zero-stats

      - name: Enable ccache
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Lanceurs gcc/g++ de ccache (MSYS2) en tête du PATH, s'ils existent ; sinon compilation directe (journalisé).
          if [ -d /mingw64/lib/ccache/bin ]; then echo "ccache: /mingw64/lib/ccache/bin (mis en tête du PATH par chaque étape de compilation)"; else echo "ccache: /mingw64/lib/ccache/bin absent, compilation directe"; fi
          ccache --zero-stats

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          make -j3 all-debug VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed
          make -j3 demo-test VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed

      - name: End to end from the package (Unix)
        if: runner.os != 'Windows'
        run: make -j3 e2e-init VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed E2E_RUN_GRAPHICS=0

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Le profil MINGW64 met /mingw64/bin avant le PATH hérité : les lanceurs ccache sont remis devant ici.
          if [ -d /mingw64/lib/ccache/bin ]; then export PATH="/mingw64/lib/ccache/bin:$PATH"; fi
          mingw32-make -j3 all-debug VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed
          mingw32-make -j3 demo-test VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed

      - name: End to end from the package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if [ -d /mingw64/lib/ccache/bin ]; then export PATH="/mingw64/lib/ccache/bin:$PATH"; fi
          mingw32-make -j3 e2e-init VCPKG_TRIPLET=${{ matrix.triplet }} VCPKG_INSTALLED_ROOT=./vcpkg_installed E2E_RUN_GRAPHICS=0

      - name: ccache statistics (Unix)
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats

      - name: ccache statistics (Windows)
        if: always() && runner.os == 'Windows'
        shell: msys2 {0}
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.triplet }}-${{ github.run_id }}
