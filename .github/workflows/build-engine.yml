name: Build & Release Engine

# Tags v* publish a release. A push to main builds the same five packages WITHOUT publishing (the release job needs a tag):
# it proves the release build before anyone tags, and it fills the vcpkg cache of main, which is the only branch a tag run can
# read caches from (caches made on dev or in pull requests are invisible to a tag).
# A tag on a commit that main already built successfully REUSES that build's packages (job `reuse`) instead of rebuilding:
# the release publishes exactly the files proven on main, in under a minute. Otherwise (tag elsewhere, failed or expired
# main build) the tag run builds as before.
on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

# Least privilege: the build jobs only read the repository; the release job asks for contents: write itself.
permissions:
  contents: read

env:
  # Same binary cache directory and keys as ci.yml: both workflows read and write the same vcpkg archives.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives

jobs:
  # ── Reuse the packages of main's build for the tagged commit ───────────────────────────────
  # Only for a tag. Finds the push run of this workflow on main for the same commit: a run still in progress is WAITED for
  # (up to 45 minutes: tagging right after the merge is the normal case); a successful run counts only if its five package
  # artifacts (one per platform of the matrix below) are still there (7-day retention). Empty output: build again.
  reuse:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          PLATFORMS: "5"   # entries of the build matrix
        run: |
          run_id=""
          deadline=$((SECONDS + 2700))
          while true; do
            json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-engine.yml/runs?head_sha=$SHA&event=push&branch=main")
            ok=$(echo "$json" | jq -r '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].id // empty')
            pending=$(echo "$json" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            echo "main builds of $SHA: success=${ok:-none}, not finished=$pending"
            if [ -n "$ok" ]; then run_id="$ok"; break; fi
            if [ "${pending:-0}" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 30
          done
          if [ -n "$run_id" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false and (.name | startswith("orosmo-")))] | length')
            echo "run $run_id: $n/$PLATFORMS package artifacts available"
            if [ "$n" -ne "$PLATFORMS" ]; then run_id=""; fi
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then echo "Reusing the packages of main run $run_id"; else echo "No reusable main build: building"; fi

  build:
    needs: reuse
    # Push to main / manual run: `reuse` is skipped (empty output) and the build runs; tag: only without a reusable main build.
    if: ${{ !cancelled() && needs.reuse.outputs.run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
            triplet: arm64-linux
            cache_id: linux-arm64
            exe_ext: ""

          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            triplet: x64-mingw-static
            cache_id: x64-mingw-static   # same value as the triplet in ci.yml
            msystem: MINGW64
            exe_ext: .exe

          - name: Linux x64
            os: ubuntu-24.04   # same image as ci.yml (the apt package set below is the one CI proves)
            platform: linux-x64
            triplet: x64-linux
            cache_id: linux              # ci.yml names its Linux archive cache "linux"
            exe_ext: ""

          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
            triplet: arm64-osx
            cache_id: arm64-osx
            exe_ext: ""

          - name: macOS x64
            os: macos-15-intel
            platform: macos-x64
            triplet: x64-osx
            cache_id: x64-osx
            exe_ext: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # branch stable, pinned: the branch moves
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo-tools
          key: cargo-${{ matrix.platform }}-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-

      # ── Windows: MSYS2 + MinGW64 ───────────────────────────────────────────────
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit   # keep the Windows PATH (cargo)
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git
            zip
            unzip
            tar

      # ── Linux: system packages ─────────────────────────────────────────────────
      # On Linux vcpkg.json only provides glad, msdfgen and nlohmann-json: glfw, glm, stb, shaderc, freetype, vulkan and
      # doctest come from apt (same list as ci.yml, minus the test-only packages xvfb / mesa drivers / validation layers).
      - name: Setup Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libwayland-dev libxkbcommon-dev wayland-protocols libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      # ── macOS: ensure tools ────────────────────────────────────────────────────
      - name: Setup macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja cmake zip

      # vcpkg has no prebuilt tools for arm64 Linux: use the system cmake and ninja installed above.
      - name: vcpkg on arm64 Linux
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      # ── vcpkg bootstrap ────────────────────────────────────────────────────────
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      # ── vcpkg cache (shared with ci.yml) ───────────────────────────────────────
      # vcpkg stores each built package as an archive in the binary cache; restoring that directory makes the install take
      # seconds instead of 10-20 minutes. The key ends with the run id so a new entry is saved every run (an existing cache
      # is immutable); restore-keys finds the newest one.
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-archives-${{ matrix.cache_id }}-

      # ── Install vcpkg dependencies ─────────────────────────────────────────────
      - name: Install vcpkg dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=. \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=. \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # ── Link the apt packages into vcpkg_installed/ (Linux) ────────────────────────────────────
      # `make -f mk/engine.mk` bypasses the root Makefile, which is what normally runs this script; without it
      # stb_image.h and ft2build.h are not found (reproduced from a clean clone). Idempotent, so it also runs on a cache hit.
      - name: Link apt packages (Linux)
        if: runner.os == 'Linux'
        run: TRIPLET=${{ matrix.triplet }} sh tools/setup-linux-deps.sh

      # ── Build dist package + engine tool ───────────────────────────────────────
      # 'engine-tool' builds debug+release archives, packages the dist/ into a zip (with LICENSE),
      # and compiles the orosmo tool (small: the package is downloaded at run time, never embedded).
      # The package carries deps/ (tools/package-deps.sh): the engine's third-party libraries from ./vcpkg_installed, static;
      # on Linux plus the static archives of the apt packages installed above (libshaderc_combined.a, glslang, SPIRV-Tools,
      # freetype, png16, brotli). Never the Vulkan loader, OpenGL, X11/Wayland or libc.
      - name: Build engine tool (Unix)
        if: runner.os != 'Windows'
        run: |
          # -Werror is proven on Linux x64 only (ci.yml builds the other platforms with WERROR=0 for the same reason).
          make -f mk/engine.mk engine-tool \
            WERROR=${{ matrix.platform == 'linux-x64' && '1' || '0' }} \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      - name: Build engine tool (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mingw32-make -f mk/engine.mk engine-tool \
            WERROR=0 \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      # ── Upload artifacts ───────────────────────────────────────────────────────
      # 'make engine-tool' already produces:
      #   dist/orosmo-<platform>[.exe]      — standalone orosmo tool binary
      #   dist/orosmo-pkg-<platform>.zip    — engine package (headers, libs, make/, tools/)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orosmo-${{ matrix.platform }}
          path: |
            dist/orosmo-${{ matrix.platform }}${{ matrix.exe_ext }}
            dist/orosmo-pkg-${{ matrix.platform }}.zip
          retention-days: 7

  # ── Fresh machine: what a new user does, from the files of this build ────────────────────────
  # install.sh (or install.ps1) installs ONLY what it installs for a user (system packages, the tool, the engine), from the
  # artifacts of this run served as a local release directory (OROSMO_DOWNLOAD_BASE, with its SHA256SUMS): no vcpkg, no
  # engine sources, no network for Orosmo's files. Then orosmo init, orosmo build and, on Linux, orosmo run headless (Mesa
  # llvmpipe under Xvfb, as ci.yml). Linux is blocking (the release waits for it); macOS and Windows are not proven yet.
  fresh-linux:
    name: Fresh machine (ubuntu:24.04, install.sh)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orosmo-linux-x64
          path: /tmp/release
      - name: Local release directory (SHA256SUMS)
        working-directory: /tmp/release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # Root in the container: --allow-root (no sudo there); a user runs it without, and is asked before sudo.
      # SHELL=/bin/sh: the PATH line goes to ~/.profile (checked below).
      - name: install.sh --yes
        env:
          OROSMO_DOWNLOAD_BASE: /tmp/release
          SHELL: /bin/sh
        run: sh site/public/install.sh --yes --allow-root
      # A desktop has a display and a GPU driver; the container gets Xvfb and Mesa's software rasterizer instead.
      - name: Display and OpenGL driver (test only)
        run: apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
      - name: orosmo init, build, run (headless)
        shell: bash
        env:
          OROSMO_DOWNLOAD_BASE: /tmp/release
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -eux
          grep -F '.orosmo/bin' "$HOME/.profile"           # the PATH line written by install.sh
          . "$HOME/.profile"
          command -v orosmo
          orosmo list
          cd /tmp && orosmo init mygame && cd mygame
          orosmo build
          xvfb-run -a -s "-screen 0 1280x720x24" \
            orosmo run -- --api opengl --headless --capture /tmp/capture --capture-frames 3
          test -s /tmp/capture/scene.png && test -s /tmp/capture/ui.png
          orosmo doctor

  fresh-macos:
    name: Fresh machine (macOS arm64, install.sh)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-latest
    continue-on-error: true   # not proven yet; macOS OpenGL stops at 4.1: build only, no run (as e2e-init in ci.yml)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orosmo-macos-arm64
          path: ${{ runner.temp }}/release
      - name: Local release directory (SHA256SUMS)
        working-directory: ${{ runner.temp }}/release
        run: shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS
      - name: install.sh --yes, orosmo init, build
        env:
          OROSMO_DOWNLOAD_BASE: ${{ runner.temp }}/release
        run: |
          set -eux
          sh site/public/install.sh --yes
          export PATH="$HOME/.orosmo/bin:$PATH"
          cd "$RUNNER_TEMP" && orosmo init mygame && cd mygame
          orosmo build

  fresh-windows:
    name: Fresh machine (Windows x64, install.ps1)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    continue-on-error: true   # not proven yet (MSYS2 is preinstalled on the runner: install.ps1 only adds its packages)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orosmo-windows-x64
          path: ${{ runner.temp }}/release
      - name: Local release directory (SHA256SUMS)
        shell: pwsh
        working-directory: ${{ runner.temp }}/release
        run: |
          Get-ChildItem -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
      # The runner's shell is elevated: -AllowAdmin (a user runs it without).
      - name: install.ps1 -Yes
        shell: pwsh
        env:
          OROSMO_DOWNLOAD_BASE: ${{ runner.temp }}/release
        run: ./site/public/install.ps1 -Yes -AllowAdmin
      - name: orosmo init, build (MSYS2 MinGW64 shell)
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: "1"
          OROSMO_DOWNLOAD_BASE: ${{ runner.temp }}/release
        run: |
          set -x
          export PATH="$(cygpath "$LOCALAPPDATA")/Orosmo/bin:$PATH"
          cd "$(cygpath "$RUNNER_TEMP")" && orosmo init mygame && cd mygame
          orosmo build

  # ── GitHub Release ─────────────────────────────────────────────────────────────
  release:
    needs: [reuse, build, fresh-linux]
    runs-on: ubuntu-latest
    # Packages from this run's build (proven on a fresh Linux machine), or reused from main's build of the same commit
    # (build and fresh-linux skipped: main's run proved them).
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') &&
          ((needs.build.result == 'success' && needs.fresh-linux.result == 'success') ||
           (needs.build.result == 'skipped' && needs.reuse.outputs.run_id != '')) }}
    permissions:
      contents: write
      actions: read   # download the artifacts of another run (main's build)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is cut from main (docs/06): refuse a tag that points at a commit main does not contain.
      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main: merge the pull request first, then tag main"
            exit 1
          fi

      - name: Download the packages of this run
        if: needs.reuse.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: orosmo-*
          merge-multiple: true

      - name: Download the packages of main's build (same commit)
        if: needs.reuse.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: orosmo-*
          merge-multiple: true
          run-id: ${{ needs.reuse.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: List the release files
        run: |
          ls -l dist/
          test "$(ls dist/ | wc -l)" -eq 10   # 5 platforms x (orosmo tool + package)

      # The installers (site/public/, also served by the site) and the engine's LICENSE (Apache-2.0, next to the tools) are
      # attached too; SHA256SUMS covers every release file (install.sh / install.ps1 check the tool against it, `orosmo
      # install` the package). Format of sha256sum: "<hash>  <file name>".
      - name: Installers, LICENSE and SHA256SUMS
        run: |
          cp site/public/install.sh site/public/install.ps1 LICENSE dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Orosmo ${{ github.ref_name }}"
          body: |
            ## Orosmo — ${{ github.ref_name }}

            ### Download

            | Platform | Orosmo tool | Engine package |
            |---|---|---|
            | Windows x64 (MinGW) | `orosmo-windows-x64.exe` | `orosmo-pkg-windows-x64.zip` |
            | Linux x64           | `orosmo-linux-x64`       | `orosmo-pkg-linux-x64.zip`   |
            | Linux arm64         | `orosmo-linux-arm64`     | `orosmo-pkg-linux-arm64.zip` |
            | macOS arm64 (M1+)   | `orosmo-macos-arm64`     | `orosmo-pkg-macos-arm64.zip` |
            | macOS x64 (Intel)   | `orosmo-macos-x64`       | `orosmo-pkg-macos-x64.zip`   |

            **Install** (system packages after confirmation, the `orosmo` tool in `~/.orosmo/bin`, then the latest engine):
            ```sh
            # Linux, macOS
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```
            ```powershell
            # Windows (PowerShell)
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            **Orosmo tool** (`orosmo`) — downloads the engine package automatically from this release.
            ```sh
            # New project (the engine version is installed once in ~/.orosmo/engines/<version>, shared by every project)
            orosmo init myproject
            cd myproject && make debug

            # Update an existing project to the latest engine
            cd myproject && orosmo update
            ```

            **Engine package** — generic engine public headers (`include/orosmo/{core,platform,rhi,renderer,assets,anim,scene,ui}`), pre-built static
            libraries (debug + release: `libcore`, `libplatform`, `librhi`, `librenderer`, `libassets`, `libanim`, `libscene`, `libsim`, `libui`, `libthirdparty`), `engine.mk`,
            the interface language compiler `cui`, the generic RHI shaders (`shaders/rhi`), the default font and themes (`res/`),
            a minimal example buildable from the package (`examples/minimal`), and `deps/`: the engine's third-party libraries,
            prebuilt and static (no vcpkg, no `make install`; the Vulkan loader, OpenGL and X11/Wayland come from the system).
            Installed by `orosmo install <version>` (checked against `SHA256SUMS`), or used offline: `orosmo init --package orosmo-pkg-<platform>.zip myproject`.

            **Graphics API**: the RHI has an OpenGL 4.3+ backend (with `glClipControl`: OpenGL 4.5 or `GL_ARB_clip_control`);
            Backends: OpenGL 4.3 and Vulkan 1.3 (`--backend vulkan|opengl`, fallback to OpenGL if Vulkan cannot start); Metal later. **Guide**: `docs/USING_THE_ENGINE.md`; incompatible changes: `docs/releases/`.
          generate_release_notes: true
          files: dist/*
