name: Build & Release Engine

# Tags v* publish a release. A push to main builds the same four packages WITHOUT publishing (the release job needs a tag):
# it proves the release build before anyone tags, and it fills the vcpkg cache of main, which is the only branch a tag run can
# read caches from (caches made on dev or in pull requests are invisible to a tag).
on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

env:
  # Same binary cache directory and keys as ci.yml: both workflows read and write the same vcpkg archives.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            triplet: x64-mingw-static
            cache_id: x64-mingw-static   # same value as the triplet in ci.yml
            msystem: MINGW64
            exe_ext: .exe

          - name: Linux x64
            os: ubuntu-24.04   # same image as ci.yml (the apt package set below is the one CI proves)
            platform: linux-x64
            triplet: x64-linux
            cache_id: linux              # ci.yml names its Linux archive cache "linux"
            exe_ext: ""

          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
            triplet: arm64-osx
            cache_id: arm64-osx
            exe_ext: ""

          - name: macOS x64
            os: macos-15-intel
            platform: macos-x64
            triplet: x64-osx
            cache_id: x64-osx
            exe_ext: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo-tools
          key: cargo-${{ matrix.platform }}-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-

      # ── Windows: MSYS2 + MinGW64 ───────────────────────────────────────────────
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit   # keep the Windows PATH (cargo)
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git
            zip
            unzip
            tar

      # ── Linux: system packages ─────────────────────────────────────────────────
      # On Linux vcpkg.json only provides glad, msdfgen and nlohmann-json: glfw, glm, stb, shaderc, freetype, vulkan and
      # doctest come from apt (same list as ci.yml, minus the test-only packages xvfb / mesa drivers / validation layers).
      - name: Setup Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool \
            libglfw3-dev libglm-dev libstb-dev libshaderc-dev glslc doctest-dev \
            libfreetype-dev libvulkan-dev libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      # ── macOS: ensure tools ────────────────────────────────────────────────────
      - name: Setup macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja cmake zip

      # ── vcpkg bootstrap ────────────────────────────────────────────────────────
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg --depth=1
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

      # ── vcpkg cache (shared with ci.yml) ───────────────────────────────────────
      # vcpkg stores each built package as an archive in the binary cache; restoring that directory makes the install take
      # seconds instead of 10-20 minutes. The key ends with the run id so a new entry is saved every run (an existing cache
      # is immutable); restore-keys finds the newest one.
      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-

      # ── Install vcpkg dependencies ─────────────────────────────────────────────
      - name: Install vcpkg dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=. \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          $VCPKG_ROOT/vcpkg install \
            --triplet=${{ matrix.triplet }} \
            --x-manifest-root=. \
            --x-install-root=./vcpkg_installed \
            --no-print-usage

      - name: Save vcpkg archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-archives-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # ── Link the apt packages into vcpkg_installed/ (Linux) ────────────────────────────────────
      # `make -f mk/engine.mk` bypasses the root Makefile, which is what normally runs this script; without it
      # stb_image.h and ft2build.h are not found (reproduced from a clean clone). Idempotent, so it also runs on a cache hit.
      - name: Link apt packages (Linux)
        if: runner.os == 'Linux'
        run: TRIPLET=${{ matrix.triplet }} sh tools/setup-linux-deps.sh

      # ── Build dist package + engine tool ───────────────────────────────────────
      # 'engine-tool' builds debug+release archives, packages the dist/ into a zip,
      # and compiles the engine binary (downloads the pkg from GitHub at runtime).
      - name: Build engine tool (Unix)
        if: runner.os != 'Windows'
        run: |
          # -Werror is proven on Linux only (ci.yml builds Windows and macOS with WERROR=0 for the same reason).
          make -f mk/engine.mk engine-tool \
            WERROR=${{ runner.os == 'Linux' && '1' || '0' }} \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      - name: Build engine tool (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mingw32-make -f mk/engine.mk engine-tool \
            WERROR=0 \
            VCPKG_TRIPLET=${{ matrix.triplet }} \
            VCPKG_INSTALLED_ROOT=./vcpkg_installed

      # ── Upload artifacts ───────────────────────────────────────────────────────
      # 'make engine-tool' already produces:
      #   dist/engine-<platform>[.exe]      — standalone engine tool binary
      #   dist/engine-pkg-<platform>.zip    — engine package (headers, libs, make/, tools/)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: |
            dist/engine-${{ matrix.platform }}${{ matrix.exe_ext }}
            dist/engine-pkg-${{ matrix.platform }}.zip
          retention-days: 7

  # ── GitHub Release ─────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is cut from main (docs/06): refuse a tag that points at a commit main does not contain.
      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main: merge the pull request first, then tag main"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Engine ${{ github.ref_name }}"
          body: |
            ## C++ Game Engine — ${{ github.ref_name }}

            ### Download

            | Platform | Engine tool | Engine package |
            |---|---|---|
            | Windows x64 (MinGW) | `engine-windows-x64.exe` | `engine-pkg-windows-x64.zip` |
            | Linux x64           | `engine-linux-x64`       | `engine-pkg-linux-x64.zip`   |
            | macOS arm64 (M1+)   | `engine-macos-arm64`     | `engine-pkg-macos-arm64.zip` |
            | macOS x64 (Intel)   | `engine-macos-x64`       | `engine-pkg-macos-x64.zip`   |

            **Engine tool** — downloads the engine package automatically from this release.
            ```sh
            # New project
            ./engine init myproject
            cd myproject && make install && make debug

            # Update existing project
            cd myproject && ./engine update
            ```

            **Engine package** — headers, pre-built libs (debug + release), `engine.mk`, CUI tools, and `vcpkg.json`.
            Downloaded automatically by `engine init` / `engine update`. Run `make install` to populate `vcpkg_installed/`.
          generate_release_notes: true
          files: dist/*
